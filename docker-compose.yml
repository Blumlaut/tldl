# docker-compose.yml
version: "3.9"
services:
  bot:
    build: .
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      DISCORD_MESSAGE_CONTENT_INTENT: ${DISCORD_MESSAGE_CONTENT_INTENT:-false}
      WYOMING_HOST: wyoming
      WYOMING_PORT: 10300
      NODE_ENV: production
    restart: unless-stopped

volumes:
  wyoming-cache:
